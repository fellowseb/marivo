<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7a5c"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="1060" fill="#fef8eb"/>

  <!-- ================= HEADER ================= -->
  <rect x="0" y="0" width="1600" height="64" fill="#f1e4c9"/>
  <line x1="0" y1="64" x2="1600" y2="64" stroke="#e0cfae" stroke-width="2"/>
  <rect x="24" y="14" width="330" height="38" rx="19" fill="#fef8eb" stroke="#e0cfae" stroke-width="2"/>
  <rect x="40" y="24" width="18" height="18" rx="3" fill="none" stroke="#8a7a5c" stroke-width="2"/>
  <line x1="44" y1="30" x2="54" y2="30" stroke="#8a7a5c" stroke-width="2"/>
  <line x1="44" y1="35" x2="54" y2="35" stroke="#8a7a5c" stroke-width="2"/>
  <text x="68" y="39" font-size="16" fill="#3b2f1c">Le Jeu de l'amour et du hasard</text>
  <g font-size="15" fill="#6b5a3e">
    <text x="400" y="40">Script</text>
    <text x="462" y="40">Blocking</text>
    <rect x="456" y="46" width="62" height="4" rx="2" fill="#3fad46"/>
    <text x="540" y="40">Settings</text>
    <text x="615" y="40">Participants</text>
  </g>
  <circle cx="1470" cy="32" r="14" fill="none" stroke="#8a7a5c" stroke-width="2"/>
  <path d="M1462,24 a12,12 0 1,0 16,16" fill="none" stroke="#8a7a5c" stroke-width="2"/>
  <circle cx="1512" cy="32" r="14" fill="#e0cfae"/>
  <text x="1508" y="37" font-size="14" fill="#3b2f1c">M</text>

  <!-- ================= TOOLBAR ================= -->
  <g font-size="14" fill="#6b5a3e">
    <rect x="640" y="76" width="320" height="34" rx="17" fill="#f1e4c9"/>
    <text x="668" y="98">↶ undo</text>
    <text x="748" y="98">↷ redo</text>
    <text x="828" y="98">⌕ search</text>
  </g>

  <!-- ================= SCRIPT LINE (one line, full width) ================= -->
  <rect x="24" y="124" width="1552" height="56" rx="8" fill="#ffffff" stroke="#e0cfae" stroke-width="2"/>
  <rect x="24" y="124" width="10" height="56" rx="5" fill="#3fad46"/>
  <text x="60" y="158" font-size="16" font-weight="bold" fill="#3b2f1c">DORANTE</text>
  <text x="160" y="158" font-size="15" fill="#6b5a3e">Je viens vous demander un service de conséquence : c'est de me donner Silvie pour femme.</text>
  <text x="1540" y="158" font-size="20" fill="#8a7a5c">…</text>
  <path d="M44,196 C 60,214 640,214 780,222" fill="none" stroke="#8a7a5c" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="790" y="228" font-size="13" font-style="italic" fill="#8a7a5c">une seule ligne de script — la réplique en cours (défilement horizontal, sync avec la lecture)</text>

  <!-- ================= TIMELINE — MULTI-TRACK ================= -->
  <rect x="24" y="248" width="1552" height="290" rx="8" fill="#ffffff" stroke="#e0cfae" stroke-width="2"/>
  <text x="44" y="276" font-size="15" font-weight="bold" fill="#3b2f1c">Timeline — pistes empilées (une piste = un rectangle pleine largeur, un type de cue)</text>
  <text x="1300" y="276" font-size="13" fill="#8a7a5c">zoom : − [=======] +</text>

  <!-- time ruler -->
  <line x1="180" y1="292" x2="1540" y2="292" stroke="#d8d2c6" stroke-width="1"/>
  <g font-size="11" fill="#8a7a5c">
    <text x="180" y="308">0:00</text><text x="470" y="308">2:00</text><text x="760" y="308">4:00</text><text x="1050" y="308">6:00</text><text x="1340" y="308">8:00</text>
  </g>

  <!-- TRACK 1 : Déplacements (blue) -->
  <rect x="180" y="316" width="1360" height="46" rx="4" fill="#eef4fa" stroke="#c9d8e6" stroke-width="1"/>
  <text x="44" y="344" font-size="13" fill="#2b5d7c" font-weight="bold">Déplacements</text>
  <g fill="#4a90c2">
    <rect x="260" y="324" width="120" height="30" rx="4"/>
    <rect x="470" y="324" width="90" height="30" rx="4"/>
    <rect x="700" y="324" width="150" height="30" rx="4"/>
    <rect x="1000" y="324" width="80" height="30" rx="4"/>
    <rect x="1240" y="324" width="130" height="30" rx="4"/>
  </g>
  <g font-size="11" fill="#ffffff" text-anchor="middle">
    <text x="320" y="343">D → centre</text>
    <text x="775" y="343">S traverse</text>
    <text x="1305" y="343">A recule</text>
  </g>

  <!-- TRACK 2 : Entrées / Sorties (green) -->
  <rect x="180" y="366" width="1360" height="46" rx="4" fill="#eef7ee" stroke="#c6dfc8" stroke-width="1"/>
  <text x="44" y="394" font-size="13" fill="#2c7a34" font-weight="bold">Entrées / Sorties</text>
  <g fill="#3fad46">
    <rect x="200" y="374" width="60" height="30" rx="4"/>
    <rect x="920" y="374" width="70" height="30" rx="4"/>
    <rect x="1480" y="374" width="60" height="30" rx="4"/>
  </g>
  <g font-size="11" fill="#ffffff" text-anchor="middle">
    <text x="230" y="393">entrée D</text>
    <text x="955" y="393">entrée A</text>
    <text x="1510" y="393">sortie S</text>
  </g>

  <!-- TRACK 3 : Props (orange) -->
  <rect x="180" y="416" width="1360" height="46" rx="4" fill="#fdf6e7" stroke="#ecd9b0" stroke-width="1"/>
  <text x="44" y="444" font-size="13" fill="#9c6f1f" font-weight="bold">Props</text>
  <g fill="#e8b04b">
    <rect x="390" y="424" width="100" height="30" rx="4"/>
    <rect x="860" y="424" width="110" height="30" rx="4"/>
  </g>
  <g font-size="11" fill="#ffffff" text-anchor="middle">
    <text x="440" y="443">chaise posée</text>
    <text x="915" y="443">lettre remise</text>
  </g>

  <!-- TRACK 4 : Gestes / Regards (purple) -->
  <rect x="180" y="466" width="1360" height="46" rx="4" fill="#f5f0fa" stroke="#ddd0ea" stroke-width="1"/>
  <text x="44" y="494" font-size="13" fill="#6b4590" font-weight="bold">Gestes / Regards</text>
  <g fill="#9b6fc0">
    <rect x="560" y="474" width="80" height="30" rx="4"/>
    <rect x="1140" y="474" width="90" height="30" rx="4"/>
  </g>
  <g font-size="11" fill="#ffffff" text-anchor="middle">
    <text x="600" y="493">S se retourne</text>
    <text x="1185" y="493">D salue</text>
  </g>

  <!-- playhead -->
  <line x1="760" y1="292" x2="760" y2="516" stroke="#e8b04b" stroke-width="3"/>
  <circle cx="760" cy="292" r="6" fill="#e8b04b"/>
  <text x="775" y="530" font-size="12" font-style="italic" fill="#9c6f1f">position de lecture</text>

  <!-- ================= STAGE VIEWER ================= -->
  <rect x="24" y="556" width="1552" height="330" rx="8" fill="#ffffff" stroke="#e0cfae" stroke-width="2"/>
  <text x="44" y="584" font-size="15" font-weight="bold" fill="#3b2f1c">Stage Viewer — plan 2D (rendu animé)</text>
  <g font-size="13" fill="#6b5a3e">
    <rect x="1180" y="568" width="150" height="26" rx="13" fill="#f1e4c9"/>
    <text x="1192" y="586">filtre personnage</text>
    <rect x="1340" y="568" width="120" height="26" rx="13" fill="#f1e4c9"/>
    <text x="1352" y="586">vue : face ☰</text>
  </g>
  <!-- stage floor -->
  <path d="M420,610 L1380,610 L1340,850 L460,850 Z" fill="#fbf6ea" stroke="#c9b88f" stroke-width="3"/>
  <text x="900" y="602" font-size="13" fill="#8a7a5c" text-anchor="middle">FOND DE SCÈNE</text>
  <text x="900" y="872" font-size="13" fill="#8a7a5c" text-anchor="middle">FACE / PUBLIC</text>
  <text x="398" y="735" font-size="13" fill="#8a7a5c" text-anchor="middle">Jardin</text>
  <text x="1402" y="735" font-size="13" fill="#8a7a5c" text-anchor="middle">Cour</text>
  <!-- characters -->
  <circle cx="620" cy="690" r="30" fill="#dcebf7" stroke="#4a90c2" stroke-width="3"/>
  <text x="620" y="696" font-size="18" fill="#2b5d7c" text-anchor="middle" font-weight="bold">D</text>
  <circle cx="1050" cy="660" r="30" fill="#dcebf7" stroke="#4a90c2" stroke-width="3"/>
  <text x="1050" y="666" font-size="18" fill="#2b5d7c" text-anchor="middle" font-weight="bold">S</text>
  <circle cx="820" cy="780" r="30" fill="#dcebf7" stroke="#4a90c2" stroke-width="3"/>
  <text x="820" y="786" font-size="18" fill="#2b5d7c" text-anchor="middle" font-weight="bold">A</text>
  <!-- movement arrow synced with track 1 -->
  <path d="M650,690 Q 830,640 1015,662" fill="none" stroke="#4a90c2" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="835" y="620" font-size="13" font-style="italic" fill="#2b5d7c" text-anchor="middle">déplacement en cours (piste bleue)</text>
  <!-- props -->
  <rect x="1240" y="760" width="46" height="46" fill="#f3ead9" stroke="#a08a5f" stroke-width="3"/>
  <text x="1263" y="789" font-size="12" fill="#6b5a3e" text-anchor="middle">chaise</text>
  <circle cx="540" cy="800" r="12" fill="#dcecd7" stroke="#3fad46" stroke-width="2"/>
  <text x="540" y="830" font-size="12" fill="#6b5a3e" text-anchor="middle">arbre</text>

  <!-- ================= PLAYBACK CONTROLS ================= -->
  <rect x="24" y="906" width="1552" height="100" rx="8" fill="#ffffff" stroke="#e0cfae" stroke-width="2"/>
  <g>
    <circle cx="80" cy="956" r="22" fill="#f1e4c9" stroke="#8a7a5c" stroke-width="2"/>
    <path d="M73,946 L94,956 L73,966 Z" fill="#3b2f1c"/>
    <circle cx="138" cy="956" r="22" fill="#f1e4c9" stroke="#8a7a5c" stroke-width="2"/>
    <rect x="130" y="948" width="16" height="16" fill="#3b2f1c"/>
    <circle cx="196" cy="956" r="22" fill="#f1e4c9" stroke="#8a7a5c" stroke-width="2"/>
    <rect x="189" y="949" width="14" height="14" fill="#3b2f1c"/>
  </g>
  <line x1="260" y1="956" x2="1000" y2="956" stroke="#d8d2c6" stroke-width="4" stroke-linecap="round"/>
  <line x1="260" y1="956" x2="430" y2="956" stroke="#4a90c2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="430" cy="956" r="9" fill="#fef8eb" stroke="#4a90c2" stroke-width="3"/>
  <text x="260" y="992" font-size="13" fill="#6b5a3e">00:42</text>
  <text x="1000" y="992" font-size="13" fill="#6b5a3e" text-anchor="end">12:30</text>
  <g font-size="13" fill="#6b5a3e">
    <rect x="1040" y="940" width="330" height="34" rx="17" fill="#f1e4c9"/>
    <rect x="1040" y="940" width="110" height="34" rx="17" fill="#fef8eb" stroke="#e0cfae" stroke-width="2"/>
    <text x="1095" y="962" text-anchor="middle" font-weight="bold">virtuel</text>
    <text x="1205" y="962" text-anchor="middle">audio</text>
    <text x="1315" y="962" text-anchor="middle">manuel</text>
  </g>
  <g font-size="13" fill="#6b5a3e">
    <text x="1400" y="930">vitesse :</text>
    <line x1="1400" y1="962" x2="1520" y2="962" stroke="#d8d2c6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1470" cy="962" r="8" fill="#fef8eb" stroke="#8a7a5c" stroke-width="3"/>
    <text x="1530" y="966">140 wpm</text>
  </g>

  <!-- ================= ANNOTATIONS ================= -->
  <g font-size="14" font-style="italic" fill="#8a7a5c">
    <text x="30" y="118" font-weight="bold" fill="#3b2f1c">Page Blocking — esquisse 2D (v2)</text>
    <path d="M900,530 C 900,545 880,550 860,556" fill="none" stroke="#8a7a5c" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="920" y="548" font-size="13">les pistes pilotent le viewer</text>
  </g>

  <text x="800" y="1040" font-size="13" font-style="italic" fill="#8a7a5c" text-anchor="middle">Wireframe non contractuel — script en une ligne en haut, pistes de timeline empilées (1 piste = 1 type de cue), stage viewer en bas</text>
</svg>
