services:
  api:
    restart: unless-stopped
    networks:
      - network
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dev
    ports:
      - 3001:3001
    depends_on:
      - postgres
      - garage
      - redis
    volumes:
      - ./apps/api:/app/apps/api
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./package.json:/app/package.json
    env_file: "./apps/api/.env.development.docker"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  worker:
    restart: unless-stopped
    networks:
      - network
    build:
      context: ./apps/worker
      target: dev
    ports:
      - 8081:8081
    depends_on:
      - redis
    env_file: "./apps/worker/.env.development.docker"
    volumes:
      - ./apps/worker:/app
  postgres:
    restart: unless-stopped
    networks:
      - network
    image: postgres:18
    ports:
      - 5432:5432
    env_file: "./.env.development.docker"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./apps/api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./apps/api/dev/fixtures.sql:/docker-entrypoint-initdb.d/02-fixtures.sql
  pgadmin:
    image: dpage/pgadmin4:9.19
    ports:
      - 5050:80
    env_file: "./.env.development.docker"
    networks:
      - network
  redis:
    restart: unless-stopped
    image: redis:alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - network
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - 5540:5540
    volumes:
      - redisinsight_data:/data
    networks:
      - network
  garage:
    image: dxflrs/garage:v2.5.0
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    restart: unless-stopped
    env_file: "./.env.development.docker"
    # no --default-bucket/--default-access-key: the api provisions its own
    # key + bucket on first boot via the admin API (see #166)
    command: /garage server --single-node
    volumes:
      - ./apps/api/dev/garage.toml:/etc/garage.toml
      - ./apps/api/dev/garage/meta:/var/lib/garage/meta
      - ./apps/api/dev/garage/data:/var/lib/garage/data
    networks:
      - network
  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    volumes:
      - ./apps/api/dev/garage.toml:/etc/garage.toml:ro
    ports:
      - 3909:3909
    env_file: "./.env.development.docker"
    networks:
      - network
volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
networks:
  network:
