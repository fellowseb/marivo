name: E2E

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/webapp/**'
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'compose.yaml'
      - 'scripts/e2e-env.sh'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generate gitignored env files + garage.toml for the compose stack
      - run: |
          CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }} \
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }} \
          MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY || '' }} \
          bash scripts/e2e-env.sh
      - run: docker compose up -d --build postgres redis garage api worker
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health/ready > /dev/null; then
              echo "API ready"; exit 0
            fi
            sleep 5
          done
          docker compose logs api
          exit 1
      - run: pnpm --filter @marivo/webapp exec playwright install --with-deps chromium
      - run: pnpm --filter @marivo/webapp test:e2e
        env:
          # A fresh Clerk user is created per run and deleted afterwards;
          # only the CI instance keys are needed as secrets
          E2E_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_BASE_URL: http://localhost:5173
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/webapp/playwright-report
            apps/webapp/playwright-results
          retention-days: 7
